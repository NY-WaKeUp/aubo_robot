aubo_i10:
  # publish all joint states--------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50
  aubo_i10_controller:
    type: position_controllers/JointTrajectoryController
    joints: 
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
    gains:
      shoulder_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      upperArm_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      foreArm_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      wrist1_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      wrist2_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      wrist3_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.05
      shoulder_joint: {trajectory: 0.1, goal: 0.1}
      upperArm_joint: {trajectory: 0.1, goal: 0.1}
      foreArm_joint: {trajectory: 0.1, goal: 0.1}
      wrist1_joint: {trajectory: 0.1, goal: 0.1}
      wrist2_joint: {trajectory: 0.1, goal: 0.1}
      wrist3_joint: {trajectory: 0.1, goal: 0.1}
      stop_trajectory_duration: 0.5
      action_monitor_rate: 10
  gazebo_ros_control:
    pid_gains:
      shoulder_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      upperArm_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      foreArm_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      wrist1_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      wrist2_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
      wrist3_joint:
        p: 100
        i: 1
        d: 1
        i_clamp: 1
