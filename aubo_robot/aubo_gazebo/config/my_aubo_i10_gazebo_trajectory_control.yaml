aubo_i10:
  aubo_i10_controller:
    type: position_controllers/JointTrajectoryController
    publish_rate: &loop_hz 500
    joints: 
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.05
      shoulder_pan_joint: {trajectory: 0.1, goal: 0.1}
      shoulder_lift_joint: {trajectory: 0.1, goal: 0.1}
      elbow_joint: {trajectory: 0.1, goal: 0.1}
      wrist_1_joint: {trajectory: 0.1, goal: 0.1}
      wrist_2_joint: {trajectory: 0.1, goal: 0.1}
      wrist_3_joint: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0.5
    state_publish_rate: *loop_hz
    action_monitor_rate: 10
  gazebo_ros_control:
    pid_gains:
      shoulder_joint: {p: 20000,  d: 100, i: 10, i_clamp: 1}
      upperArm_joint:  {p: 20000,  d: 100, i: 20, i_clamp: 1}
      foreArm_joint:  {p: 10000,  d: 100, i: 10, i_clamp: 1}
      wrist1_joint:   {p: 500,  d: 1, i: 1, i_clamp: 1}
      wrist2_joint:   {p: 500,  d: 1, i: 1, i_clamp: 1}
      wrist3_joint:   {p: 10,  d: 0.1, i: 0, i_clamp: 1}  
    